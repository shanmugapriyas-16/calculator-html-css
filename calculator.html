<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <div style="background-color: black; border-radius: 10px; padding: 20px; width: 150px; height: 325px;">
            <input   style="background-color: white; color: black; height:20px ; width:140px; border-radius: 10px; font-weight: bold; text-align: center;" placeholder="welcome to calculator"><br><br>
            <input   style="background-color: rgb(181, 166, 166); color: white; height: 20px; width: 140px; border-radius: 10px;text-align-last:right ; " placeholder="0"><br><br>
            <button  style="width: 30px; height: 30px; border-radius: 10px;">AC</button>
            <button  style="width: 30px; height: 30px; border-radius: 30px;">%</button>
            <button  style="width: 30px; height: 30px; border-radius: 30px;" >^</button>
            <button  style="width: 30px; height: 30px; border-radius: 30px;background-color: chocolate;">x</button><br><br>

            <button  style="width: 30px; height: 30px; border-radius: 30px;background-color: rgb(66, 58, 58); color: white;">7</button>
            <button  style="width: 30px; height: 30px; border-radius: 30px;background-color: rgb(66, 58, 58); color: white;">8</button>
            <button  style="width: 30px; height: 30px; border-radius: 30px;background-color: rgb(66, 58, 58); color: white;">9</button>
            <button  style="width: 30px; height: 30px; border-radius: 30px; background-color: chocolate;">/</button><br><br>

            <button  style="width: 30px; height: 30px; border-radius: 30px;background-color: rgb(66, 58, 58); color: white;">4</button>
            <button  style="width: 30px; height: 30px; border-radius: 30px;background-color: rgb(66, 58, 58); color: white;">5</button>
            <button  style="width: 30px; height: 30px; border-radius: 30px;background-color: rgb(66, 58, 58); color: white;">6</button>
            <button  style="width: 30px; height: 30px; border-radius: 30px;background-color: chocolate;">*</button><br><br>

            <button  style="width: 30px; height: 30px; border-radius: 30px;background-color: rgb(66, 58, 58); color: white;">1</button>
            <button  style="width: 30px; height: 30px; border-radius: 30px;background-color: rgb(66, 58, 58); color: white;">2</button>
            <button  style="width: 30px; height: 30px; border-radius: 30px;background-color: rgb(66, 58, 58); color: white;">3</button>
            <button  style="width: 30px; height: 30px; border-radius: 30px;background-color: chocolate;">-</button><br><br>

            <button  style="width: 30px; height: 30px; border-radius: 30px;background-color: rgb(66, 58, 58); color: white;">0</button>
            <button  style="width: 30px; height: 30px; border-radius: 30px;background-color: rgb(66, 58, 58); color: white;">.</button>
            <button  style="width: 30px; height: 30px; border-radius: 30px;background-color: rgb(66, 58, 58); color: white;">+</button>
            <button  style="width: 30px; height: 30px; border-radius: 30px;background-color: chocolate;">=</button><br><br>
        </div>
        </center>
    
    
</body>
</html>
